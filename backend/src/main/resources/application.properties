spring.application.name=foodfind-backend
server.port=${PORT:8080}

# Database Configuration
# Defaults to local in-memory H2 DB; easily overridden by cloud environment variables (e.g. on Render/Railway)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:foodfinddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (available at http://localhost:8080/h2-console in local dev)
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# Logging
logging.level.com.foodfind=INFO
logging.level.org.springframework.web=INFO
