spring.application.name=foodfind-backend
server.port=${PORT:8080}

# =============================================================================
# Database Configuration
#
# PRODUCTION (Render):
#   Set SPRING_DATASOURCE_URL to your Render PostgreSQL internal URL, e.g.:
#   jdbc:postgresql://<host>/<db>
#   Set SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD accordingly.
#   Render provides these on the PostgreSQL dashboard under "Connection".
#
# LOCAL DEV fallback: H2 in-memory (no setup needed)
# =============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:foodfind;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# HikariCP — generous limits since Render PostgreSQL free tier supports 97 connections
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=60000

# H2 console (local dev only — disabled in prod since SPRING_DATASOURCE_URL overrides to PG)
spring.h2.console.enabled=true

# =============================================================================
# Admin Credentials
# Set ADMIN_USERNAME and ADMIN_PASSWORD as env vars on Render — never commit
# real credentials to git.
# =============================================================================
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:admin123}

# Logging
logging.level.com.foodfind=INFO
logging.level.org.springframework.web=INFO

# =============================================================================
# Test Data Seeding — Hyderabad + Visakhapatnam restaurants & menus
# true  (default) : seeds on first boot only; skips if DB already has data
# false           : set this when going live with real data
# =============================================================================
app.seed-data=${APP_SEED_DATA:true}
