spring.application.name=foodfind-backend
server.port=${PORT:8080}

# =============================================================================
# Database — Clever Cloud MySQL (free persistent storage)
# Data now survives every restart. Override via env vars on Render/Railway etc.
# =============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://bv2852mnc8b926v5vgd4-mysql.services.clever-cloud.com:3306/bv2852mnc8b926v5vgd4?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&autoReconnect=true&connectTimeout=10000&socketTimeout=30000}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:uh576pywonufk9di}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ZRJbvA5lgLsJ6chxjjT8}

spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# HikariCP pool — DEV plan allows max 5 connections, keep pool small
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=60000

# H2 console disabled (no longer using H2)
spring.h2.console.enabled=false

# =============================================================================
# Admin Credentials
# On first boot the plaintext password is BCrypt-hashed in memory automatically.
# For production, replace admin.password with a pre-computed BCrypt hash, e.g.:
#   python3 -c "import bcrypt; print(bcrypt.hashpw(b'YourPass', bcrypt.gensalt(12)).decode())"
# or use https://bcrypt-generator.com (12 rounds)
# Then set env vars ADMIN_USERNAME and ADMIN_PASSWORD on Render — never commit
# real credentials to git.
# =============================================================================
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:admin123}
# admin.token is no longer used — sessions are random UUIDs generated at login
# and expire automatically after 8 hours (or on logout)

# Logging
logging.level.com.foodfind=INFO
logging.level.org.springframework.web=INFO

# =============================================================================
# Test Data Seeding — Hyderabad + Visakhapatnam restaurants & menus
# true  (default) : seeds on first boot only; skips if DB already has data
# false           : set this when going live — combined with a DB reset on
#                   Clever Cloud, gives you a completely clean production DB
#
# To go live:
#   1. Clever Cloud dashboard → Reset Database
#   2. Add env var  APP_SEED_DATA=false  on Render
#   3. Redeploy → empty DB, ready for real data via Admin Portal
# =============================================================================
app.seed-data=${APP_SEED_DATA:true}
